<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>currency-convertion</title>
  <link rel="stylesheet" href="src/style.css">
  <script type="module" src="src/app.js" defer></script>
  <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.6.1/chart.js"></script> -->
</head>

<body class="bg-gray-100 relative">

  <div id="screenLoader" class="absolute inset-0 bg-yellow-200 z-10 flex justify-center items-center">
    <img src="src/assets/loading-text.gif" alt="Loading Animation Text">
  </div>

  <!-- Start Header -->
  <header>

    <!-- Start Nav -->
    <nav class="bg-yellow-200 p-5">
      <h2 class="text-center font-bold text-xl">Kalkulator Kurs</h2>
    </nav>
    <!-- End Nav -->

  </header>
  <!-- End Header -->

  <!-- Start Main -->
  <main class="lg:h-screen w-full md:w-[80%] m-auto">

    <section id="calculator" class="flex flex-col lg:flex-row justify-center">

      <div id="left-content" class="flex-1 p-5">
        <div class="bg-white p-3 rounded-xl flex flex-col gap-5">
          <h2 class="font-semibold text-xl">Konversi</h2>

          <div>
            <label for="jumlah">Jumlah</label>
            <div class="flex items-center p-2 border-gray-200 border-2 rounded-2xl">
              <input id="jumlah" name="jumlah" type="text" class="p-2 focus:outline-none w-full">
              <span id="currencySymbolText" class="font-semibold ml-2">IDR</span>
            </div>
          </div>

          <div class="flex flex-col lg:flex-row lg:items-center">

            <div class="mr-2">
              <label for="from">Dari</label>
              <div class="flex items-center p-2 border-gray-200 border-2 rounded-2xl">
                <select name="from" id="from" class="w-full p-2 focus:outline-none">
                </select>
              </div>
            </div>

            <button id="btnChange" type="button" class="self-center rounded-full p-2 border-gray-200 border-2 mt-5">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true">
                <path d="M7 20V4" />
                <path d="M3 8l4-4 4 4" />
                <path d="M17 4v16" />
                <path d="M21 16l-4 4-4-4" />
              </svg>
            </button>

            <div class="ml-2">
              <label for="to">Ke</label>
              <div class="flex items-center p-2 border-gray-200 border-2 rounded-2xl">
                <select name="to" id="to" class="w-full p-2 focus:outline-none">
                </select>
              </div>
            </div>

          </div>

          <div id="resultContainer" class="bg-yellow-200 p-6 rounded-2xl flex-col gap-3 flex relative">
            <div id="loaderResult" class="hidden loader bg-yellow-200 rounded-2xl">
              <img src="src/assets/loader2.gif" width="50" alt="Loader">
            </div>
            <p id="jumlahKonversiText">100 Dolar AS</p>

            <div class="flex items-baseline gap-2">
              <p id="resultKonversiText" class="font-bold text-3xl"></p>
              <p id="currencyResultKonversiText" class="font-medium text-sm">USD</p>
            </div>

            <div class="border rounded-full border-dotted border-gray-500"></div>
            <div class="flex justify-between font-light text-xs">
              <p id="keteranganText"></p>
              <p id="dateText"></p>
            </div>
          </div>
        </div>
      </div>

      <div id="right-content" class="flex-1 lg:flex-2 p-5">
        <div class="bg-white p-3 rounded-xl relative">
          <div id="loaderGrafik" class="hidden loader bg-white rounded-xl">
            <img src="src/assets/loader2.gif" width="50" alt="Loader">
          </div>

          <p id="textPergerakanGrafik">Pergerakan USD to IDR</p>

          <div class="flex items-center justify-between">
            <div>
              <p id="mainGrafikText" class="font-bold text-3xl"></p>
              <div id="subTextContainer" class="inline-flex rounded-full p-2 items-center bg-green-200">
                <svg id="svgArrowUp" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="15" height="15"
                  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  aria-hidden="true">
                  <path d="M12 19V5" />
                  <path d="M5 12l7-7 7 7" />
                </svg>

                <svg id="svgArrowDown" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="15" height="15"
                  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  aria-hidden="true">
                  <path d="M12 5v14" />
                  <path d="M19 12l-7 7-7-7" />
                </svg>

                <p id="subTextGrafik" class="text-xs ml-0.5"></p>
              </div>
            </div>

            <select name="time" id="time">
              <option value="7">1 Minggu</option>
              <option value="30">1 Bulan</option>
              <option value="90">3 Bulan</option>
              <option value="360">1 Tahun</option>
            </select>
          </div>

          <div>
            <canvas id="grafik"></canvas>
          </div>

          <div id="summary" class="flex justify-between gap-3">

            <div class="bg-gray-100 rounded-2xl p-2 flex-1">
              <p class="text-xs text-gray-400">Tertinggi</p>
              <p class="font-semibold text-sm" id="textTertinggi">-</p>
            </div>

            <div class="bg-gray-100 rounded-2xl p-2 flex-1">
              <p class="text-xs text-gray-400">Terendah</p>
              <p class="font-semibold text-sm" id="textTerendah">-</p>
            </div>

            <div class="bg-gray-100 rounded-2xl p-2 flex-1">
              <p class="text-xs text-gray-400">Rata-rata</p>
              <p class="font-semibold text-sm" id="textRata2">-</p>
            </div>

          </div>
        </div>
      </div>

    </section>

    <section id="riwayat" class="p-3 rounded-2xl bg-white mb-5">
      <div class="flex items-center justify-between">
        <h2 class="font-semibold text-xl mb-3">Riwayat</h2>
        <button id="btnRemoveRiwayat" type="button" class="bg-red-300 hover:bg-red-200 hover:cursor-pointer rounded-full p-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18" />
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
            <path d="M10 11v6" />
            <path d="M14 11v6" />
          </svg>
      </button>
      </div>

      <div class="flex flex-wrap gap-3" id="riwayatContainer">
      </div>

      <h3 id="textRiwayatKosong" class="hidden">Tidak ada riwayat</h3>
    </section>

  </main>
  <!-- End Main -->

  <!-- Start Footer -->
  <footer class="text-center bg-gray-800 text-gray-200 p-5 text-xs">&copy; 2026 Arya Ashari</footer>
  <!-- End Footer -->
</body>

</html>
